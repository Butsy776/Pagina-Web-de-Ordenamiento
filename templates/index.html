<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Dinámico de Productos - LPII</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #0f172a;
            color: #f8fafc;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 25px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #f8fafc;
            font-size: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .btn-grupo {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button, input {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 14px;
        }
        button {
            background-color: #238636;
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .btn-secundario {
            background-color: #1f6feb;
        }
        .btn-secundario:hover {
            background-color: #388bfd;
        }
        .btn-benchmark {
            background-color: #8957e5;
        }
        .btn-benchmark:hover {
            background-color: #9c6ade;
        }
        input {
            background-color: #0f172a;
            color: white;
            width: 200px;
            border: 1px solid #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #1e293b;
            color: #f8fafc;
        }
        tr:hover {
            background-color: #273548;
        }
        #resultado-busqueda, #resultado-benchmark {
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Catálogo Dinámico de Productos</h1>

        <!-- Sección 1: Opciones de Ordenamiento -->
        <div class="card">
            <h3> Opciones de Ordenamiento (Quicksort)</h3>
            <div class="btn-grupo">
                <button onclick="cargar('id', 'asc')">Ordenar por ID</button>
                <button onclick="cargar('precio', 'asc')">Ordenar por Menor Precio</button>
                <button onclick="cargar('precio', 'desc')">Ordenar por Mayor Precio</button>
                <button onclick="cargar('nombre', 'asc')">Ordenar por Nombre</button>
            </div>
        </div>

        <!-- Sección 2: Búsqueda Binaria -->
        <div class="card">
            <h3> Búsqueda por ID (Búsqueda Binaria)</h3>
            <div class="btn-grupo" style="align-items: center;">
                <input type="number" id="inputId" placeholder="Ingrese ID (ej. 1)...">
                <button class="btn-secundario" onclick="buscarPorId()">Buscar Producto</button>
            </div>
            <div id="resultado-busqueda"></div>
        </div>

        <!-- Sección 3: Benchmark -->
        <div class="card">
            <h3> Quicksort vs Bubble Sort (Benchmark)</h3>
            <button class="btn-benchmark" onclick="ejecutarBenchmark()">Ejecutar Comparativa (1,000 elementos)</button>
            <div id="resultado-benchmark"></div>
        </div>

        <!-- Sección 4: Tabla Principal -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <table id="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Cargar y ordenar productos en la tabla
        async function cargar(campo, orden) {
            try {
                const res = await fetch('./productos.json');
                let data = await res.json();

                data.sort((a, b) => {
                    let valA = a[campo];
                    let valB = b[campo];
                    
                    if (typeof valA === 'string') {
                        valA = valA.toLowerCase();
                        valB = valB.toLowerCase();
                    }

                    if (orden === 'asc') {
                        return valA > valB ? 1 : valA < valB ? -1 : 0;
                    } else {
                        return valA < valB ? 1 : valA > valB ? -1 : 0;
                    }
                });

                const tbody = document.querySelector('#tabla tbody');
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nombre}</td>
                        <td>$${p.precio}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error al cargar los productos:", error);
            }
        }

        // Búsqueda Binaria por ID en el cliente
        async function buscarPorId() {
            const id = parseInt(document.getElementById('inputId').value);
            const contenedor = document.getElementById('resultado-busqueda');
            contenedor.style.display = 'block';
            
            if (isNaN(id)) {
                contenedor.innerHTML = `<b style="color: #f85149;">Por favor ingresa un ID válido.</b>`;
                return;
            }

            try {
                const res = await fetch('./productos.json');
                let productos = await res.json();

                // Precondición: Ordenar por ID antes de la búsqueda binaria
                productos.sort((a, b) => a.id - b.id);

                let izquierda = 0;
                let derecha = productos.length - 1;
                let encontrado = null;

                while (izquierda <= derecha) {
                    let medio = Math.floor((izquierda + derecha) / 2);
                    if (productos[medio].id === id) {
                        encontrado = productos[medio];
                        break;
                    } else if (productos[medio].id < id) {
                        izquierda = medio + 1;
                    } else {
                        derecha = medio - 1;
                    }
                }

                if (encontrado) {
                    contenedor.innerHTML = `<b style="color: #3fb950;">¡Producto encontrado!</b> ID: ${encontrado.id} | <b>${encontrado.nombre}</b> | Precio: $${encontrado.precio}`;
                } else {
                    contenedor.innerHTML = `<b style="color: #f85149;">ID ${id} no encontrado.</b>`;
                }
            } catch (error) {
                contenedor.innerHTML = `<b style="color: #f85149;">Error al realizar la búsqueda.</b>`;
            }
        }

        // Algoritmos de ordenamiento para el Benchmark en JS
        function jsQuicksort(arr, clave) {
            if (arr.length <= 1) return arr;
            const pivot = arr[Math.floor(arr.length / 2)][clave];
            const left = arr.filter(x => x[clave] < pivot);
            const middle = arr.filter(x => x[clave] === pivot);
            const right = arr.filter(x => x[clave] > pivot);
            return [...jsQuicksort(left, clave), ...middle, ...jsQuicksort(right, clave)];
        }

        function jsBubbleSort(arr, clave) {
            let a = [...arr];
            let n = a.length;
            for (let i = 0; i < n; i++) {
                let swapped = false;
                for (let j = 0; j < n - i - 1; j++) {
                    if (a[j][clave] > a[j+1][clave]) {
                        let temp = a[j];
                        a[j] = a[j+1];
                        a[j+1] = temp;
                        swapped = true;
                    }
                }
                if (!swapped) break;
            }
            return a;
        }

        // Ejecutar Benchmark
        async function ejecutarBenchmark() {
            const contenedor = document.getElementById('resultado-benchmark');
            contenedor.style.display = 'block';
            contenedor.innerHTML = "Ejecutando pruebas de rendimiento con 1,000 elementos...";

            const total = 1000;
            let muestra = [];
            for (let i = 1; i <= total; i++) {
                muestra.push({
                    id: i,
                    nombre: `Item-${i}`,
                    precio: parseFloat((Math.random() * 998 + 1).toFixed(2))
                });
            }
            // Mezclar aleatoriamente
            muestra.sort(() => Math.random() - 0.5);

            let muestraQuick = [...muestra];
            let muestraBubble = [...muestra];

            let t0 = performance.now();
            jsQuicksort(muestraQuick, 'precio');
            let msQuicksort = performance.now() - t0;

            let t1 = performance.now();
            jsBubbleSort(muestraBubble, 'precio');
            let msBubble = performance.now() - t1;

            let velocidad = msQuicksort > 0 ? (msBubble / msQuicksort).toFixed(1) : 0;

            contenedor.innerHTML = `
                <b>📊 Resultados del Benchmark (${total} elementos):</b><br>
                 Quicksort: <code>${msQuicksort.toFixed(4)} ms</code><br>
                 Bubble Sort: <code>${msBubble.toFixed(4)} ms</code><br>
                <em>Quicksort fue ${velocidad}x más rápido que BubbleSort</em>
            `;
        }

        cargar('precio', 'asc');
    </script>
</body>
</html>
